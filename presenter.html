<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표자 화면 — GameNGen</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="css/deck.css">
<style>
  html,body{overflow:auto;background:#0a0a0b}
  body{padding:28px 36px;font-family:var(--display);color:var(--ink);height:100vh;box-sizing:border-box;display:flex;flex-direction:column}
  .top{display:flex;align-items:flex-end;gap:36px;border-bottom:1px solid var(--line);padding-bottom:18px}
  .lvl{font:800 64px/1 var(--mono);color:var(--real)}
  .ttl{font-weight:800;font-size:42px;line-height:1.2;letter-spacing:-.035em;flex:1}
  .stp{font-size:19px;font-weight:500;letter-spacing:0;color:var(--ink2);margin-top:6px}
  .clk{text-align:right;font-family:var(--mono)}
  .clk b{display:block;font-size:56px;line-height:1}
  .clk small{font:500 16px var(--sans);color:var(--ink2)}
  .pace{font:700 18px var(--sans);padding:4px 12px;border-radius:999px;display:inline-block;margin-top:8px}
  .pace.ok{background:rgba(94,242,255,.12);color:var(--gen)}
  .pace.late{background:rgba(255,74,28,.16);color:var(--real)}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:34px;margin-top:22px;flex:1;min-height:0}
  /* only the script column scrolls, so the timer and click list stay put */
  .script{font-size:28px;line-height:1.7;letter-spacing:-.02em;white-space:pre-wrap;color:var(--ink);overflow:auto;padding-right:14px}
  .side{overflow:auto}
  .script b{color:var(--warn)}
  .script i{color:var(--gen)}
  /* (괄호) = not spoken: gesture / pause / glance */
  .script .dir{color:var(--ink3);font-size:.74em;font-weight:500;letter-spacing:-.01em}
  /* script split at [→]: what's already said dims, the part for this click stays bright */
  .script .seg{transition:opacity .3s}
  .script .seg.past{opacity:.32}
  .script .seg.later{opacity:.55}
  .script .go{scroll-margin-top:6px}
  .script .go{display:inline-block;font:800 15px/1 var(--sans);letter-spacing:0;padding:6px 10px;margin:0 8px 0 0;border-radius:6px;vertical-align:4px;border:1px solid var(--line2);color:var(--ink2);background:var(--bg3)}
  .script .go.done{opacity:.32}
  .script .go.nxt{color:#0a0a0b;background:var(--gen);border-color:var(--gen);box-shadow:0 0 16px rgba(94,242,255,.55);animation:goPulse 1.2s ease-in-out infinite}
  @keyframes goPulse{50%{box-shadow:0 0 4px rgba(94,242,255,.2)}}
  .side h4{font:700 17px var(--sans);color:var(--ink3);margin:0 0 10px}
  .cues{list-style:none;margin:0 0 26px;padding:0}
  .cues li{font:500 19px/1.5 var(--sans);color:var(--ink3);padding:8px 12px;border-left:3px solid transparent}
  .cues li.done{color:var(--ink2)}
  .cues li.cur{color:var(--ink);border-left-color:var(--gen);background:rgba(94,242,255,.07)}
  .cues li.nxt{color:var(--ink);border-left-color:var(--line2)}
  .memo{font-size:20px;line-height:1.6;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:22px}
  .next{font:500 19px var(--sans);color:var(--ink2)}
  .next b{color:var(--ink)}
  .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btns button{background:var(--bg3);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font:600 17px var(--sans);padding:10px 16px;cursor:pointer}
  .btns button:hover{border-color:var(--gen)}
  .conn{position:fixed;right:18px;bottom:12px;font:14px var(--sans);color:var(--ink3)}
  .bar{height:6px;background:var(--bg3);border-radius:3px;margin-top:14px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gen);width:0;transition:width .3s}
  .bar i.late{background:var(--real)}
</style>
</head>
<body>
  <div class="top">
    <div class="lvl" id="lvl">--</div>
    <div class="ttl"><div id="ttl">덱 창을 기다리는 중…</div><div class="stp" id="stp"></div></div>
    <div class="clk"><b id="clk">00:00</b><small>경과 · 목표 <span id="tgt">—</span></small><br><span class="pace ok" id="pace">시간 맞음</span></div>
  </div>
  <div class="bar"><i id="sbar"></i></div>
  <div class="grid">
    <div class="script" id="script"></div>
    <div class="side">
      <h4>이 슬라이드의 클릭</h4>
      <ul class="cues" id="cues"></ul>
      <h4>메모</h4>
      <div class="memo" id="memo"></div>
      <div class="next" id="next"></div>
      <div class="btns">
        <button data-c="prev">◀ 이전</button><button data-c="next">다음 ▶</button>
        <button data-c="reset">타이머 리셋</button><button data-c="black">블랙아웃</button>
      </div>
    </div>
  </div>
  <div class="conn" id="conn">이 창에서도 ← → 키가 동작해요</div>
<script src="js/notes.js"></script>
<script>
(function () {
  const N = window.DECK_NOTES, $ = id => document.getElementById(id);
  let st = null, slideStart = Date.now(), lastIdx = -1, bc = null;
  try { bc = new BroadcastChannel('gamengen-deck'); bc.onmessage = e => onState(e.data); } catch (e) {}
  addEventListener('storage', e => { if (e.key === 'gg-state' && e.newValue) onState(JSON.parse(e.newValue)); });
  function send(cmd, extra) {
    const m = Object.assign({ type: 'cmd', cmd, nonce: Math.random().toString(36).slice(2) }, extra || {});
    try { bc && bc.postMessage(m); } catch (e) {}
    try { localStorage.setItem('gg-cmd', JSON.stringify(m)); } catch (e) {}
  }
  const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  // [→] in the script = click here. Segment k is spoken while the deck sits at step k.
  function renderScript(n, s) {
    const html = md(n.script || '');
    if (s.id === 'qa') return html;
    return html.replace(/\(([^()\n]*)\)/g, '<span class="dir">($1)</span>').split('[→]').map((p, k) =>
      (k ? `<span class="go ${k <= s.step ? 'done' : k === s.step + 1 ? 'nxt' : ''}">▶ 클릭 ${k}</span>` : '') +
      `<span class="seg ${k < s.step ? 'past' : k > s.step ? 'later' : 'cur'}">${p}</span>`).join('');
  }
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function onState(s) {
    if (!s || s.type !== 'state') return;
    st = s;
    if (s.idx !== lastIdx) { slideStart = Date.now(); lastIdx = s.idx; }
    const n = N[s.id] || {};
    $('lvl').textContent = s.id === 'boot' ? '--' : s.id === 'qa' ? 'Q&A' : String(s.idx).padStart(2, '0');
    $('ttl').textContent = n.title || s.id;
    $('stp').textContent = `클릭 ${s.step} / ${s.steps} · 배정 ${n.budget || 0}초`;
    $('script').innerHTML = renderScript(n, s);
    // bring the part for this click (with its ▶ badge) to the top of the script column
    const cur = $('script').querySelector('.seg.cur');
    if (cur && s.step > 0) (cur.previousElementSibling || cur).scrollIntoView({ block: 'start', behavior: 'smooth' });
    else $('script').scrollTop = 0;
    $('memo').textContent = n.memo || '—';
    $('tgt').textContent = n.cum ? fmt(n.cum) : '—';
    $('cues').innerHTML = (n.cues || []).map((c, i) => `<li class="${i < s.step ? 'done' : i === s.step ? 'cur' : i === s.step + 1 ? 'nxt' : ''}">${md(c)}</li>`).join('');
    const nid = s.ids && s.ids[s.idx + 1], nn = N[nid];
    $('next').innerHTML = s.step < s.steps ? `다음 클릭: <b>${md((n.cues || [])[s.step + 1] || '')}</b>` : (nn ? `다음 슬라이드: <b>${nn.title}</b>` : '');
    tick();
  }
  function tick() {
    if (!st) return;
    const n = N[st.id] || {};
    const el = st.t0 ? (Date.now() - st.t0) / 1000 : 0;
    $('clk').textContent = fmt(el);
    const late = n.cum && el > n.cum + 5;
    $('pace').className = 'pace ' + (late ? 'late' : 'ok');
    $('pace').textContent = !n.cum ? '—' : late ? `${Math.round(el - n.cum)}초 늦음` : '시간 맞음';
    const inSlide = (Date.now() - slideStart) / 1000, b = n.budget || 0;
    $('sbar').style.width = b ? Math.min(100, inSlide / b * 100) + '%' : '0';
    $('sbar').className = b && inSlide > b ? 'late' : '';
  }
  setInterval(tick, 500);
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => send(b.dataset.c));
  addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { send('next'); e.preventDefault(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { send('prev'); e.preventDefault(); }
    if (e.key === 'b' || e.key === '.') send('black');
  });
  send('hello');
  try { const s = localStorage.getItem('gg-state'); if (s) onState(JSON.parse(s)); } catch (e) {}
})();
</script>
</body>
</html>
